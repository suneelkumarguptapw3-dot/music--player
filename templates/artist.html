<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171616">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Player">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/global.css">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="stylesheet" href="/static/contextmenu.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/bar.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/background.css" type="text/css" media="all" />
    <title>Document</title>
</head>

<body>
    <header>
        <img src="/icon.svg" alt="lmusic" srcset="">
        <h1>Music</h1>
    </header>
    <div class="artists">
    </div>
    <script>
        window.addEventListener("pageshow", (event) => {
            const navType = performance.getEntriesByType("navigation")[0]?.type;
            if (event.persisted || navType === "back_forward") {
                window.location.reload();
            }
        });

        let i = `<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 -960 960 960"  fill="#e3e3e3"><path d="M748-560h132v60h-83v235q0 47-29 76t-76 29q-47 0-76-29t-29-76q0-47 29-76t76-29q17 0 31 4t25 12v-206ZM80-160v-94q0-32 17-61.5t51-44.5q75-33 133.5-46.5T400-420q47 0 90.5 7.5T581-388q-12 11-21 22.5T544-340q-32-10-68-15t-76-5q-58 0-109 11t-119 43q-16 8-24 22.5t-8 29.5v34h390q4 19 11.5 34t18.5 26H80Zm212-363q-42-42-42-108t42-108q42-42 108-42t108 42q42 42 42 108t-42 108q-42 42-108 42t-108-42Zm172.5-43.5Q490-592 490-631t-25.5-64.5Q439-721 400-721t-64.5 25.5Q310-670 310-631t25.5 64.5Q361-541 400-541t64.5-25.5ZM400-631Zm0 411Z"/></svg>`;

        fetch("/api/artists").then(response => response.json()).then(data => {
            for (el of data) {
                let card = document.createElement("a");
                card.href = `/artist?artist_name=${el}`;
                card.className = "artist";
                let div = document.createElement("div");
                div.innerText = el;
                div2 = document.createElement("div");
                div2.innerHTML = i;
                card.appendChild(div2);
                card.appendChild(div);
                document.querySelector(".artists").appendChild(card);
            };
        });




        window.parent["home_page"] = document;
        window.parent.addEventListener("load", () => {
            document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);
            // document.body.style.background = window.parent.document.body.style.background;
        });
        document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);
        // document.body.style.background = window.parent.document.body.style.background;

    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        button {
            border: none;
            background-color: transparent;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            display: flex;
            height: 50px;
            width: 160px;
            border-radius: 7px;
            align-items: center;
            gap: 5px;
            color: rgb(53, 52, 110);
            background-color: rgba(97, 100, 102, 0.192);
        }

        header>img {
            height: 48px;
        }

        a {
            text-decoration: none;
            font-size: 16px;
        }

        a>div {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 40px
        }

        a>div>*:nth-child(1) {
            color: white;
            font-size: 15px;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        a>div>*:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }



        .artists {
            width: 100%;
            height: 100%;
            margin-top: 40px;
            margin-bottom: 170px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 4px;

            overflow-x: hidden;
            overflow-y: auto;
            place-items: center;
            background-color: rgba(122, 122, 122, 0.164);
        }

        .artist>:nth-child(1) {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artist {
            display: flex;
            width: 120px;
            background-color: rgba(93, 93, 94, 0.329);
            border-radius: 5px;
            height: 150px;
            flex-direction: column;
            overflow: hidden;
        }

        .artist>:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 100%;
            white-space: nowrap;
            height: 15px;
            overflow: hidden;
            margin-bottom: 2px;
            text-align: center;
            text-overflow: ellipsis;
        }


        * -webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;

        }

        body {
            height: auto;
            background-color: rgb(40, 36, 43);
        }
    </style>
    {%include "components/bar.html"%}
</body>

</html>

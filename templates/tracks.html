<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171616">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Player">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="stylesheet" href="/static/cards.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/bar.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/background.css" type="text/css" />
    <link rel="stylesheet" href="/static/contextmenu.css">
    <link rel="stylesheet" href="/static/global.css">
    <title>Document</title>
    <script src="/static/cards.js"></script>
</head>

<body>
    <header>
        <img src="/icon.svg" alt="lmusic" srcset="">
        <h1>Music</h1>
    </header>

 <div class="tracks">
    </div>

    <script>
        

        create_track_grid("/api/tracks",document.querySelector(".tracks"));
        window.parent["track_page"] = document;
        window.parent.addEventListener("load", () => {
            
            document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);
            // document.body.style.background = window.parent.document.body.style.background;
        });
        document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);
        // document.body.style.background = window.parent.document.body.style.background;

    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        button,
        a {
            border: none;
            outline: none;
            background-color: transparent;
        }

        header {
            display: flex;
            height: 50px;
            width: 160px;
            border-radius: 7px;
            align-items: center;
            gap: 5px;
            color: rgb(53, 52, 110);
        }

       

        header>img {
            height: 48px;
        }

        .download {
            display: flex;
            width: 100vw;
            align-items: center;
            justify-content: center;
            height: 25px;
        }




        input {
            width: 100px;
            height: 20px;
        }

        button {
            width: 100px;
            height: 20px;
        }

        img {
            /* Or set a specific size like 300px */
            aspect-ratio: 1 / 1;
            /* Forces the element to be a perfect square */
            object-fit: cover;
            /* Zooms in slightly to cut out the sidebars */
            object-position: center;
            border-radius: 2px;
            /* Optional: adds rounded corners */
            /* Ensures it crops left and right evenly */
        }

        * -webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;

        }

        body {
            height: auto;
            background-color: rgb(40, 36, 43);
        }

    </style>
    {%include "components/bar.html"%}
</body>

</html>

<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            color: #f4f4f4;
            background: #171616;
        }
        .login-card {
            width: min(380px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #383838;
            border-radius: 16px;
            background: #222;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }
        h1 { margin: 0 0 24px; }
        .mode-switch { margin-bottom: 18px; color: #bbb; }
        .mode-switch button {
            width: auto;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            color: #80a4f5;
        }
        label { display: block; margin: 14px 0 7px; }
        input {
            width: 100%;
            height: 44px;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 0 12px;
            background: #171616;
            color: #fff;
            outline: none;
        }
        input:focus { border-color: #4b77d1; }
        button {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #4b77d1;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        #message { min-height: 20px; margin: 14px 0 0; font-size: 14px; }
        .error { color: #ff8a8a; }
        .success { color: #78d78a; }
        #confirm-group { display: none; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1 id="page-title">Login</h1>
        <div class="mode-switch">
            <span id="mode-text">New here?</span>
            <button id="mode-button" type="button">Create account</button>
        </div>
        <form id="login-form" novalidate="">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required="">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required="">

            <div id="confirm-group">
                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8">
            </div>

            <button id="submit-button" type="submit">Login</button>
            <p id="message" role="alert" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const submitButton = document.getElementById("submit-button");
        const message = document.getElementById("message");
        const modeButton = document.getElementById("mode-button");
        const confirmGroup = document.getElementById("confirm-group");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }

        let isRegistering = false;

        modeButton.addEventListener("click", () => {
            isRegistering = !isRegistering;
            confirmGroup.style.display = isRegistering ? "block" : "none";
            document.getElementById("page-title").textContent = isRegistering ? "Create account" : "Login";
            document.getElementById("mode-text").textContent = isRegistering ? "Already have an account?" : "New here?";
            modeButton.textContent = isRegistering ? "Back to login" : "Create account";
            submitButton.textContent = isRegistering ? "Create account" : "Login";
            passwordInput.autocomplete = isRegistering ? "new-password" : "current-password";
            showMessage("", "");
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!username || !password || (confirmGroup.style.display === "block" && !confirmPassword)) {
                showMessage("Please fill in all fields.", "error");
                (!username ? usernameInput : !password ? passwordInput : confirmPasswordInput).focus();
                return;
            }

            if (confirmGroup.style.display === "block" && password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                confirmPasswordInput.focus();
                return;
            }

            if (isRegistering && password.length < 8) {
                showMessage("Password must be at least 8 characters.", "error");
                passwordInput.focus();
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Processing...";
            showMessage("", "");

            try {
                const endpoint = isRegistering ? "/api/register" : "/api/login";
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || "Operation failed.");
                }

                showMessage(isRegistering ? "Account created! Redirecting..." : "Login successful. Redirecting...", "success");
                window.location.href = "/";
            } catch (error) {
                showMessage(error.message, "error");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = isRegistering ? "Create account" : "Login";
            }
        });

        fetch("/api/me")
            .then(response => response.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = "/";
                }
            })
            .catch(() => {});
    </script>


</body></html>

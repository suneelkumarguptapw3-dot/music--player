    <script>
        function setPWAColor(color) {
            document.querySelector('meta[name="theme-color"]')
                .setAttribute("content", color);
        }
        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                return "0:00";
            }

            seconds = Math.floor(seconds);

            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            const pad = n => String(n).padStart(2, "0");

            return hours > 0
                ? `${hours}:${pad(minutes)}:${pad(secs)}`
                : `${minutes}:${pad(secs)}`;
        }
        function matchImageSideBars(img) {
            const imageUrl = img.currentSrc || img.src;
            const element = document.body;

            if (!element) {
                throw new Error("Image has no parent element");
            }
            if (!img.complete || !img.naturalWidth) {
                return new Promise((resolve, reject) => {
                    img.addEventListener(
                        "load",
                        () => resolve(matchImageSideBars(img)),
                        { once: true }
                    );
                    img.addEventListener(
                        "error",
                        () => reject(new Error("Image failed to load")),
                        { once: true }
                    );
                });
            }

            const box = element.getBoundingClientRect();
            const imageRatio = img.naturalWidth / img.naturalHeight;
            const boxRatio = box.width / box.height;

            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;

            const ctx = canvas.getContext("2d", {
                willReadFrequently: true
            });

            let leftColor = "#000";
            let rightColor = "#000";

            try {
                ctx.drawImage(img, 0, 0);

                function sampleEdge(x) {
                    const samples = [];
                    const step = Math.max(
                        1,
                        Math.floor(img.naturalHeight / 100)
                    );

                    for (let y = 0; y < img.naturalHeight; y += step) {
                        const pixel = ctx.getImageData(x, y, 1, 1).data;
                        samples.push([pixel[0], pixel[1], pixel[2]]);
                    }

                    const avg = [0, 1, 2].map(channel =>
                        Math.round(
                            samples.reduce((sum, p) => sum + p[channel], 0)
                            / samples.length
                        )
                    );

                    return `rgb(${avg[0]}, ${avg[1]}, ${avg[2]})`;
                }

                leftColor = sampleEdge(0);
                rightColor = sampleEdge(img.naturalWidth - 1);
            } catch (error) {
                console.warn(
                    "Cannot sample image pixels; image may be cross-origin.",
                    error
                );
            }

            const hasSideBars = imageRatio < boxRatio;
            element.style.background = `linear-gradient(
        to top left,
        color-mix(in srgb, ${leftColor} 6%, rgb(20, 19, 19)),
        color-mix(in srgb, ${leftColor} 30%, rgb(17, 16, 16))
        )`;
            setPWAColor(leftColor);
            return {
                url: imageUrl,
                img,
                element,
                leftColor,
                rightColor,
                hasSideBars
            };
        }
        const context_menu = document.getElementById("context-menu");
        function create_context_menu(x, y, t) {
            let a = context_menu.firstElementChild.querySelectorAll("button");
            a.forEach(element => {
                element["m"] = t;
            });
            x = Math.min(x, (document.body.offsetWidth - (context_menu.offsetWidth)));
            y = Math.min(y, (document.body.offsetHeight - (context_menu.offsetHeight)));
            context_menu.style.top = `${y}px`;
            context_menu.style.left = `${x}px`;
            context_menu.style.display = "block";
            document.addEventListener("click", () => {
                context_menu.style.display = "none";
            }, { once: true });
            context_menu.addEventListener("click", (e) => {
                e.stopPropagation();
            })
        }
        fetch(`/api/album/${document.title}`).then(response => response.json()).then(data => {
            let n = 0;
            document.getElementById("play").addEventListener("click", () => {
                document.querySelector(".tracks").firstElementChild.click();
            });
            if (window.self != window.top) {
                for (el of data) {
                    if (n >= 52) {
                        break;
                    }
                    let id = el["id"];
                    let dur= el["duration"];
                    let card = createTrackCard(el, { includeInfo: true });
                    card.queue = function () {
                        window.parent.add_queue(this.info);
                        context_menu.style.display = "none";
                    };
                    card.play_next = function () {
                        window.parent.add_next(this.info);
                        context_menu.style.display = "none";
                    }
                    card.addEventListener("click", () => {
                        const url = new URL(window.location.href);
                        url.searchParams.delete("album");
                        url.searchParams.set("song", id);
                        window.parent.route_parent(id);
                        window.parent.fetch_metadata(id);
                    })
                    card.addEventListener("contextmenu", (event) => {
                        event.preventDefault();
                        create_context_menu(event.clientX, event.clientY, event.currentTarget);
                        window.parent.add_queue(event.currentTarget.info)
                    });
                    document.querySelector(".tracks").appendChild(card);
                    n++;
                };
                return;
            }
            for (el of data) {
                let id = el["id"];
                let card = createTrackCard(el, {
                    element: "a",
                    href: `/player?song=${id}&album=${el["album"]}`,
                    target: "_top"
                });
                document.querySelector(".tracks").appendChild(card);
                n++;
            };

        })
        matchImageSideBars(document.querySelector("img"))
    </script>
    <style>
        body {
            width: 100vw;
            height: 100vh;
        }

        * {
            margin: 0;
            padding: 0;
        }

        * {
            scrollbar-width: none;
        }


        button {
            background: none;
            border: none;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        h3 {
            color: aliceblue;
            text-align: center;
            margin: 15px;
            font-size: 20px;
        }

        .image-container {
            max-width: min(100vw, 60vh);
            margin-inline: auto;

        }

        .image-container>img {
            width: 100%;
        }

        a,
        .track {
            text-decoration: none;
            font-size: 16px;
        }

        .track>div {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 40px
        }

        .track>div>*:nth-child(1) {
            color: white;
            font-size: 15px;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track>div>*:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        img {
            /* Or set a specific size like 300px */
            aspect-ratio: 1 / 1;
            /* Forces the element to be a perfect square */
            object-fit: cover;
            /* Zooms in slightly to cut out the sidebars */
            object-position: center;
            border-radius: 2px;
            /* Optional: adds rounded corners */
            /* Ensures it crops left and right evenly */
        }

        #context-menu {
            position: absolute;
            display: none;
            height: 165px;
            width: 151px;
            border-radius: 13px;
            z-index: 8;
            background-color: rgb(41, 41, 41);
            overflow: hidden;
        }

        #context-menu>ul {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;

            list-style: none;
        }

        #context-menu>ul>li {
            width: 100%;
            height: 20%;

            border: 1px solid rgb(0, 0, 0);
        }

        #context-menu>ul>li>button {
            color: white;
            display: flex;
            gap: 5px;
            width: 100%;
            height: 100%;
            align-items: center;
        }

        #context-menu>ul>li>button:hover {
            background-color: rgba(74, 75, 75, 0.568);
        }

        .tracks {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;

            width: 100vw;
            border-radius: 4px;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: scroll;
            padding-bottom: 150px;
            background-color: rgba(122, 122, 122, 0.041);
        }

        .track {
            border-radius: 4px;
            display: flex;
            height: 60px;
            width: 400px;
            border: 0.5px solid rgba(56, 56, 56, 0.205);
            margin: 8px;
            background-color: rgba(50, 52, 53, 0.288);
            gap: 10px;
            overflow: hidden;

        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            /*height: 40px;*/
            width: 100%;
        }

        .controls>button {
            width: min(15%, 55px);
            aspect-ratio: 1/1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            background-color: rgba(116, 119, 119, 0.226);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls>button>svg {
            height: 90%;
            width: 90%;
        }

        .bar {
            background-color: black;
            width: 100%;
            position: fixed;
            display: flex;
            align-items: flex-start;
            justify-content: space-around;
            bottom: 0;
            height: 50px;
        }

        .bar>* {
            background: none;
            border: none;
            height: 100%;
            display: flex;
        }
    </style>

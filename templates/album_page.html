<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#171616">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{name}}</title>
    <link rel="stylesheet" href="/static/global.css">
    <link rel="stylesheet" href="/static/background.css">
    <link rel="stylesheet" href="/static/contextmenu.css">
    <link rel="stylesheet" href="/static/cards.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/bar.css" type="text/css" media="all" />
    <script src=" /static/cards.js">
    </script>

</head>

<body>
    <div class="image-container">
        <img id="i" src="/api/thumbnail/{{name}}.webp?maxres=1" alt="">
    </div>
    <h3>{{name}}</h3>
    <div class="controls">
        <button>
            <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#e3e3e3">
                <path
                    d="M576-160v-60h120L522-393l42-43 176 174v-121h60v223H576Zm-374 0-42-43 538-537H576v-60h224v223h-60v-120L202-160Zm193-363L160-757l43-43 235 234-43 43Z" />
            </svg>
            <button id="play">
                <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px"
                    fill="#e3e3e3">
                    <path
                        d="m383-310 267-170-267-170v340Zm97 230q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82-31.5 155T763-197.5q-54 54.5-127 86T480-80Zm0-60q142 0 241-99.5T820-480q0-142-99-241t-241-99q-141 0-240.5 99T140-480q0 141 99.5 240.5T480-140Zm0-340Z" />
                </svg>
            </button>
        </button>
        <button>
            <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#e3e3e3">
                <path
                    d="M196-331q-20-36-28-72.5t-8-74.5q0-131 94.5-225.5T480-798h43l-80-80 39-39 149 149-149 149-40-40 79-79h-41q-107 0-183.5 76.5T220-478q0 29 5.5 55t13.5 49l-43 43ZM476-40 327-189l149-149 39 39-80 80h45q107 0 183.5-76.5T740-479q0-29-5-55t-15-49l43-43q20 36 28.5 72.5T800-479q0 131-94.5 225.5T480-159h-45l80 80-39 39Z" />
            </svg>
        </button>
    </div>


    <div class="tracks">

    </div>
    {%include "components/bar.html"%}
    <script>
        create_track_grid(`/api/album/${document.title}`,document.querySelector(".tracks"))

        document.body.style.setProperty('--bg-url', `url('${document.getElementById("i").src}')`);
        document.getElementById("play").onclick=()=>{
            document.querySelector(".tracks").playlist.forEach(element => {
                window.parent.add_next(element);
            });
            document.querySelector(".track").click();
        }
        

    </script>
    <style>
        body {
            width: 100vw;
            height: 100vh;
        }

        * {
            margin: 0;
            padding: 0;
        }

        * {
            scrollbar-width: none;
        }


        button {
            background: none;
            border: none;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        h3 {
            color: aliceblue;
            text-align: center;
            margin: 15px;
            font-size: 20px;
        }

        .image-container {
            margin-top: 20px;
            max-width: min(60vw, 40vh);
            margin-inline: auto;
            height: 60vw;
            border-radius: 5px;
            max-height: min(80vw, 60vh);
            overflow: hidden;
        }



        .image-container>img {
            width: 100%;
        }



        img {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            border-radius: 2px;

        }



        .tracks {
            margin-top: 25px;
            margin: 8px;
            display: flex;
            flex-wrap: wrap;
            width: 100vw;
            border-radius: 4px;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: scroll;
            padding-bottom: 150px;

        }


        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            /*height: 40px;*/
            width: 100%;
        }

        .controls>button {
            width: min(15%, 35px);
            aspect-ratio: 1/1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            background-color: rgba(116, 119, 119, 0.226);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls>button>svg {
            height: 90%;
            width: 90%;
        }
    </style>

</body>

</html>

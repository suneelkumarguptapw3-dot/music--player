<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Tracks</title>
    <script src="/static/cards.js"></script>
    <link rel="stylesheet" href="/static/cards.css">
    <link rel="stylesheet" href="/static/global.css">
    <link rel="stylesheet" href="/static/contextmenu.css">
    <link rel="stylesheet" href="/static/bar.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/background.css" type="text/css"/>
</head>

<body>

    <div class="tracks">

    </div>
    {%include "components/bar.html"%}
    <style>
        body {
            background-color: rgb(40, 36, 43);
            width: 100vw;
            height: 100vh;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        * {
            scrollbar-width: none;
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        button {
            background: none;
            border: none;
        }

        a {
            text-decoration: none;
            font-size: 16px;
        }


        img {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            border-radius: 2px;
        }

        .tracks {
            margin-top: 25px;
            display: flex;
            width: 100vw;
            align-items: center;
            border-radius: 4px;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: scroll;
            margin-bottom: 150px;
            background-color: rgba(122, 122, 122, 0);
        }




    </style>
    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const audio_id = urlParams.get('artist_name');
        create_track_grid(`/api/artist?artist_name=${audio_id}`,document.querySelector(".tracks"))
                  
        window.parent["artist_page"] = document;
        window.parent.addEventListener("load", () => {
            console.log("from index.html", window.parent.document.body.style.background);
            document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);
           
        });
        document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);
        


    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171616">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Player">
    <link rel="manifest" href="/manifest.json">
     <link rel="stylesheet" href="/static/global.css">
    <link rel="stylesheet" href="static/cards.css" type="text/css" media="all" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="stylesheet" href="/static/background.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/static/bar.css" type="text/css" media="all" />
    <title>Document</title>
    <script src="/static/cards.js"></script>
</head>

<body>
    <header>
        <img src="/icon.svg" alt="lmusic" srcset="">
        <h1>Music</h1>
    </header>
    <div class="albums">
    </div>
    <script src="/static/cards.js" type="text/javascript" charset="utf-8"></script>
    <script>
        create_album_grid("/api/album",document.querySelector(".albums"));

        window.parent["album_page"] = document;
        window.parent.addEventListener("load", () => {
            document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);

        });
        document.body.style.setProperty('--bg-url', `url('${window.parent.bg_img || "/static/image.jpeg"}')`);



    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        button {
            border: none;
            background-color: transparent;
        }

        header {
            display: flex;
            height: 50px;
            width: 160px;
            border-radius: 7px;
            align-items: center;
            gap: 5px;
            color: rgb(53, 52, 110);
            background-color: rgba(97, 100, 102, 0.192);
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        header>img {
            height: 48px;
        }

        a {
            text-decoration: none;
            font-size: 16px;
        }

        a>div {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 40px
        }

        a>div>*:nth-child(1) {
            color: white;
            font-size: 15px;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        a>div>*:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        img {
            /* Or set a specific size like 300px */
            aspect-ratio: 1 / 1;
            /* Forces the element to be a perfect square */
            object-fit: cover;
            /* Zooms in slightly to cut out the sidebars */
            object-position: center;
            border-radius: 2px;
            /* Optional: adds rounded corners */
            /* Ensures it crops left and right evenly */
        }

        .albums {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 5px;
            padding-inline: 5px;
            overflow-x: hidden;
            overflow-y: auto;
            margin-top: 40px;
            margin-bottom: 170px;
            place-items: center;
            background-color: rgba(122, 122, 122, 0.164);
        }


        * -webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;

        }

        body {
            height: auto;
            background-color: rgb(40, 36, 43);
        }
    </style>
    {%include "components/bar.html"%}

</body>

</html>

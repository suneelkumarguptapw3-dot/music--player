    <div class="download" style="display: none;">
        <input id="input" type="text">
        <button id="submit">submit</button>
    </div>
    <script>

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const audio_id = urlParams.get('song');
        document.getElementById("submit").addEventListener("click", async () => {
            const url = document.getElementById("input").value;
            document.getElementById("input").value = "";
            try {
                const response = await fetch("/download", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.text();
                console.log(data);
                location.reload();

            } catch (error) {
                console.error("Download failed:", error);
            }
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        button,
        a {
            border: none;
            outline: none;
            background-color: transparent;
        }

        header {
            display: flex;
            height: 50px;
            width: 160px;
            border-radius: 7px;
            align-items: center;
            gap: 5px;
            color: rgb(53, 52, 110);
        }

        /* fixed (not absolute) so .track's overflow:hidden can't clip it */

        header>img {
            height: 48px;
        }

        .download {
            display: flex;
            width: 100vw;
            align-items: center;
            justify-content: center;
            height: 25px;
        }



        .track,
        a {
            text-decoration: none;
            font-size: 16px;
        }

        .track>div {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 40px
        }

        .track>div>*:nth-child(1) {
            color: white;
            font-size: 15px;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track>div>*:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        input {
            width: 100px;
            height: 20px;
        }

        button {
            width: 100px;
            height: 20px;
        }

        img {
            /* Or set a specific size like 300px */
            aspect-ratio: 1 / 1;
            /* Forces the element to be a perfect square */
            object-fit: cover;
            /* Zooms in slightly to cut out the sidebars */
            object-position: center;
            border-radius: 2px;
            /* Optional: adds rounded corners */
            /* Ensures it crops left and right evenly */
        }

        .tracks {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            height: 320px;
            width: 100vw;
            border-radius: 4px;
            flex-direction: column;
            overflow-x: scroll;
            overflow-y: hidden;
            background-color: rgba(122, 122, 122, 0.164);
        }

        .albums {
            height: 460px;
            width: 100vw;
            margin-bottom: 170px;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(3, 150px);
            /* Fixed 3 rows */
            grid-auto-columns: 130px;
            gap: 3px;
            overflow-x: auto;
            overflow-y: hidden;
            margin-top: 40px;
            background-color: rgba(122, 122, 122, 0.164);
        }


        * -webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;

        }

        body {
            height: auto;
            background-color: rgb(40, 36, 43);
        }
    </style>

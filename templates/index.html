        <div id="auth-buttons">

                Login

            </button>

    <script>
        const loginButton = document.getElementById("login-button");
        const logoutButton = document.getElementById("logout-button");

        async function updateAuthButtons() {
            try {
                const response = await fetch("/api/me", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Authentication check failed");
                }

                const data = await response.json();

                if (data.authenticated) {
                    loginButton.hidden = true;
                    logoutButton.hidden = false;
                } else {
                    loginButton.hidden = false;
                    logoutButton.hidden = true;
                }
            } catch (error) {
                console.error("Authentication error:", error);

                loginButton.hidden = false;
                logoutButton.hidden = true;
            }
        }

        logoutButton.addEventListener("click", async () => {
            logoutButton.disabled = true;
            logoutButton.textContent = "Logging out...";

            try {
                const response = await fetch("/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Logout failed");
                }

                window.location.href = "/login";
            } catch (error) {
                console.error(error);
                logoutButton.disabled = false;
                logoutButton.textContent = "Logout";
                alert("Unable to logout. Please try again.");
            }
        });

        updateAuthButtons();
    </script>
    <script src="/static/search.js"></script>
    <style>
        .navbar {
            position: static;
            top: 0;
            height: 50px;
            display: flex;
            width: 100vw;
            align-items: center;
            background-color: rgba(31, 30, 30, 0.14);
        }
    
        /* Authentication buttons */
        #auth-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            position: absolute;
            top:5px;
            right:5px;
            z-index: 10;
        }

        /* Shared button styles */
        #login-button,
        #logout-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 10px 20px;
            border-radius: 12px;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;

            text-decoration: none;
            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

            -webkit-tap-highlight-color: transparent;
        }

        /* Login button */
        #login-button {
            color: #ffffff;
            background: linear-gradient(135deg,
                    #7c3aed,
                    #5b21b6);
            border: 1px solid rgba(167, 139, 250, 0.4);

            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.2);
        }

        #login-button:hover {
            background: linear-gradient(135deg,
                    #8b5cf6,
                    #6d28d9);

            transform: translateY(-1px);
        }

        /* Logout button */
        #logout-button {
            color: #e5e7eb;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #logout-button:hover {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);

            transform: translateY(-1px);
        }

        /* Keyboard accessibility */
        #login-button:focus-visible,
        #logout-button:focus-visible {
            outline: 2px solid #a78bfa;
            outline-offset: 3px;
        }

        /* Disabled state */
        #login-button:disabled,
        #logout-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        /* Keep hidden buttons hidden */
        #login-button[hidden],
        #logout-button[hidden] {
            display: none;
        }

        /* Smaller screens */
        @media (max-width: 480px) {

            #login-button,
            #logout-button {
                padding: 9px 15px;
                font-size: 13px;
                border-radius: 10px;
            }
        }
    </style>


    <div class="download" style="display: none;">
        <input id="input" type="text">

    <script>

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const audio_id = urlParams.get('song');
        document.getElementById("submit").addEventListener("click", async () => {
            const url = document.getElementById("input").value;
            document.getElementById("input").value = "";
            try {
                const response = await fetch("/download", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.text();

                location.reload();

            } catch (error) {
                console.error("Download failed:", error);
            }
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        button,

            border: none;
            outline: none;
            background-color: transparent;
        }

        header {
            display: flex;
            height: 50px;
            width: 60px;
            border-radius: 7px;
            align-items: center;
            gap: 5px;
            color: rgb(53, 52, 110);
        }

        /* fixed (not absolute) so .track's overflow:hidden can't clip it */

        header>img {
            height: 48px;
        }

        .download {
            display: flex;
            width: 100vw;
            align-items: center;
            justify-content: center;
            height: 25px;
        }



        .track,
        a {
            text-decoration: none;
            font-size: 16px;
        }

        .track>div {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 40px
        }

        .track>div>*:nth-child(1) {
            color: white;
            font-size: 15px;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track>div>*:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        input {
            width: 100px;
            height: 20px;
        }

        button {
            width: 100px;
            height: 20px;
        }

        img {
            /* Or set a specific size like 300px */
            aspect-ratio: 1 / 1;
            /* Forces the element to be a perfect square */
            object-fit: cover;
            /* Zooms in slightly to cut out the sidebars */
            object-position: center;
            border-radius: 2px;
            /* Optional: adds rounded corners */
            /* Ensures it crops left and right evenly */
        }
        
        .tracks {

            display: flex;
            flex-wrap: wrap;
            height: 320px;
            width: 100vw;
            border-radius: 4px;
            flex-direction: column;
            overflow-x: scroll;
            overflow-y: hidden;
            background-color: rgba(122, 122, 122, 0.164);
        }

        .continue-listening {
            display: flex;
            flex-wrap: wrap;
            width: 100vw;
            background-color: rgba(122, 122, 122, 0.164);
        }

        .albums {
            height: 470px;
            width: 100vw;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(3, 150px);
            /* Fixed 3 rows */
            grid-auto-columns: 130px;
            gap: 3px;
            overflow-x: auto;
            overflow-y: hidden;
            background-color: rgba(122, 122, 122, 0.164);
        }


        * -webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;

        }

        body {
            height: auto;
            background-color: rgb(40, 36, 43);
        }
    </style>

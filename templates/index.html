    <div class="download">
        <input id="input" type="text">
        <button id="submit">submit</button>
    </div>
    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const audio_id = urlParams.get('song');
        document.getElementById("submit").addEventListener("click", async () => {
            const url = document.getElementById("input").value;
            document.getElementById("input").value = "";
            try {
                const response = await fetch("/download", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.text();
                console.log(data);
                location.reload();

            } catch (error) {
                console.error("Download failed:", error);
            }
        });
    </script>

    <script>
        window.addEventListener("pageshow", (event) => {
            const navType = performance.getEntriesByType("navigation")[0]?.type;
            if (event.persisted || navType === "back_forward") {
                window.location.reload();
            }
        });

        const context_menu = document.getElementById("context-menu");
        function create_context_menu(x, y, t) {
            let a = context_menu.firstElementChild.querySelectorAll("button");
            a.forEach(element => {
                element["m"] = t;
            });
            x=Math.min(x,(document.body.offsetWidth - (context_menu.offsetWidth)));
            y=Math.min(y,(document.body.offsetHeight - (context_menu.offsetHeight)));
            context_menu.style.top = `${y}px`;
            context_menu.style.left = `${x}px`;
            context_menu.style.display = "block";
            document.addEventListener("click", () => {
                context_menu.style.display = "none";
            }, { once: true });
            context_menu.addEventListener("click", (e) => {
                e.stopPropagation();
            })
        }
        let l = "api/tracks";
        fetch(l).then(response => response.json()).then(data => {
            let n = 0;
            if (window.self != window.top) {
                for (el of data) {
                    if (n >= 52) {
                        break;
                    }
                    let id = el["id"];
                    let card = createTrackCard(el, { includeInfo: true });
                    card.queue = function () {
                        window.parent.add_queue(this.info);
                        context_menu.style.display="none";
                    };
                    card.play_next = function () {
                        window.parent.add_next(this.info);
                        context_menu.style.display="none";
                    }
                    card.addEventListener("click", () => {
                        
                        window.parent.route_parent(id);
                        window.parent.fetch_metadata(id);
                    })
                    card.addEventListener("contextmenu", (event) => {
                        event.preventDefault();
                        create_context_menu(event.clientX, event.clientY, event.currentTarget);
                        window.parent.add_queue(event.currentTarget.info)
                    });
                    document.querySelector(".tracks").appendChild(card);
                    n++;
                };
                return;
            }
            for (el of data) {
                if (n >= 52) {
                    break;
                }
                let id = el["id"];
                let card = createTrackCard(el, {
                    element: "a",
                    href: `/player?song=${id}`,
                    target: "_parent"
                });
                card.addEventListener("contextmenu", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    console.log("context ");
                });
                document.querySelector(".tracks").appendChild(card);
                n++;
            };

        })

        fetch("/api/album").then(response => response.json()).then(data => {
            for (el of data) {
                let card = createAlbumCard(el);
                document.querySelector(".albums").appendChild(card);
            };
        });

        window.parent["home_page"] = document;
        window.parent.addEventListener("load", () => {
            console.log("from index.html", window.parent.document.body.style.background);
            document.body.style.background = window.parent.document.body.style.background;
        });
        document.body.style.background = window.parent.document.body.style.background;

    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        button {
            border: none;
            background-color: transparent;
        }

        header {
            display: flex;
            height: 50px;
            width: 160px;
            border-radius: 7px;
            align-items: center;
            gap: 5px;
            color: rgb(53, 52, 110);
        }

        #context-menu {
            position: absolute;
            display: none;
            height: 165px;
            width: 151px;
            border-radius: 13px;
            z-index: 8;
            background-color: rgb(41, 41, 41);
            overflow: hidden;
        }

        #context-menu>ul {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;

            list-style: none;
        }

        #context-menu>ul>li {
            width: 100%;
            height: 20%;

            border: 1px solid rgb(0, 0, 0);
        }

        #context-menu>ul>li>button {
            color: white;
            display: flex;
            gap: 5px;
            width: 100%;
            height: 100%;
            align-items: center;
        }

        #context-menu>ul>li>button:hover {
            background-color: rgba(74, 75, 75, 0.568);
        }

        header>img {
            height: 48px;
        }

        .download {
            display: flex;
            width: 100vw;
            align-items: center;
            justify-content: center;
            height: 25px;
        }



        .track,
        a {
            text-decoration: none;
            font-size: 16px;
        }

        .track>div {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 40px
        }

        .track>div>*:nth-child(1) {
            color: white;
            font-size: 15px;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track>div>*:nth-child(2) {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        input {
            width: 100px;
            height: 20px;
        }

        button {
            width: 100px;
            height: 20px;
        }

        img {
            /* Or set a specific size like 300px */
            aspect-ratio: 1 / 1;
            /* Forces the element to be a perfect square */
            object-fit: cover;
            /* Zooms in slightly to cut out the sidebars */
            object-position: center;
            border-radius: 2px;
            /* Optional: adds rounded corners */
            /* Ensures it crops left and right evenly */
        }

        .tracks {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            height: 320px;
            width: 100vw;
            border-radius: 4px;
            flex-direction: column;
            overflow-x: scroll;
            overflow-y: hidden;
            background-color: rgba(122, 122, 122, 0.164);
        }

        .albums {
            height: 460px;
            width: 100vw;
            margin-bottom: 170px;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(3, 150px);
            /* Fixed 3 rows */
            grid-auto-columns: 130px;
            gap: 3px;
            overflow-x: auto;
            overflow-y: hidden;
            margin-top: 40px;
            background-color: rgba(122, 122, 122, 0.164);
        }

        .album {
            display: flex;
            width: 120px;
            background-color: rgba(93, 93, 94, 0.329);
            border-radius: 5px;
            height: 150px;
            flex-direction: column;
            overflow: hidden;
        }


        .album>div {
            color: rgb(110, 106, 106);
            font-size: 13px;
            width: 100%;
            white-space: nowrap;
            height: 15px;
            overflow: hidden;
            margin-bottom: 2px;
            text-align: center;
            text-overflow: ellipsis;
        }

        .track {
            border-radius: 4px;
            display: flex;
            height: 60px;
            width: 300px;
            border: 0.5px solid rgba(56, 56, 56, 0.205);
            margin: 8px;
            background-color: rgba(134, 134, 134, 0.185);
            gap: 10px;
            overflow: hidden;
        }

        * -webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;

        }

        body {
            height: auto;
            background-color: rgb(40, 36, 43);
        }

        .bar {
            background-color: black;
            width: 100%;
            position: fixed;
            display: flex;
            align-items: flex-start;
            justify-content: space-around;
            bottom: 0;
            height: 50px;
        }

        .bar>* {
            background: none;
            border: none;
            height: 100%;
            display: flex;
        }
    </style>

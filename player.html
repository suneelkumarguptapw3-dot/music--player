<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171616">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Player">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>music player</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .loading {
            position: sticky;
            width: 100vw;
            height: 100vh;
            background-color: #333333f1;
            z-index: 7;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(7px);
        }

        .load {
            height: 10vh;
            width: 10vh;
            border: 8px solid #444;
            border-top-color: blue;
            border-radius: 50%;
            animation: a 3s linear infinite;
        }

        @keyframes a {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="loading">
        <div class="load"></div>
    </div>
    <iframe id="emm"></iframe>
    <script>
        const frame = document.getElementById("emm");

        window.addEventListener("message", (event) => {
            if (event.origin !== location.origin) return;

            if (event.data.type === "navigate") {
                frame.src = event.data.url;
            }
        });
    </script>

    <div class="miniplayer" id="player">
        <div id="bg-image">
            <video id="video" class="hidden" muted autoplay></video>
        </div>
        <div id="overlay"></div>
        <script>
            window.addEventListener("pageshow", (event) => {
                const navType = performance.getEntriesByType("navigation")[0]?.type;
                if (event.persisted || navType === "back_forward") {
                    window.location.reload();
                }
            });
        </script>
        <button id="close">
            <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#4B77D1">
                <path d="M480-344 240-584l47.33-47.33L480-438.67l192.67-192.66L720-584 480-344Z" />
            </svg>
        </button>
        <div id="top">
            <div id="song-title">Song Title</div>
            <div id="artist">Song Artist</div>
        </div>

        <div id="artwork-lrc">
            <div id="artwork">
                <img id="artwork-img" src="" alt="Artwork">
            </div>
            <div id="lyrics-container">

            </div>
        </div>
        <div class="bottom-container">

            <div id="controls-2">
                <button id="video-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="#e3e3e3">
                        <path
                            d="M491-309q29-29 29-71v-220h120v-80H480v220q-13-9-28-14.5t-32-5.5q-42 0-71 29t-29 71q0 42 29 71t71 29q42 0 71-29ZM160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm0-80h640v-480H160v480Zm0 0v-480 480Z" />
                    </svg>
                    <div>
                        Video
                    </div>
                </button>
                <button id="toggle-queue">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                        fill="#e3e3e3">
                        <path
                            d="M641.96-160q-48.63 0-82.63-34.04-34-34.04-34-82.67 0-48.62 33.45-82.62 33.44-34 81.22-34 14.31 0 27.32 2.5T692-382v-338h188v74H758.67v370q0 48.33-34.04 82.17Q690.59-160 641.96-160ZM120-320v-66.67h310.67V-320H120Zm0-166.67v-66.66h475.33v66.66H120Zm0-166.66V-720h475.33v66.67H120Z" />
                    </svg>
                    <div>Queue</div>
                </button>
                <button id="lyrics-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                        fill="#e3e3e3">
                        <path
                            d="M80-80v-720q0-33 23.5-56.5T160-880h440q33 0 56.5 23.5T680-800v17q-24 11-44 27t-36 36v-80H160v527l47-47h393v-160q16 20 36 36t44 27v97q0 33-23.5 56.5T600-240H240L80-80Zm160-320h160v-80H240v80Zm520-80q-50 0-85-35t-35-85q0-50 35-85t85-35q11 0 21 2t19 5v-207h160v80h-80v240q0 50-35 85t-85 35Zm-520-40h280v-80H240v80Zm0-120h280v-80H240v80Zm-80 320v-480 480Z" />
                    </svg>
                    <div>
                        Lyrics
                    </div>
                </button>

                <button id="like">
                    <svg class="heart" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960"
                        width="20px" fill="#e3e3e3">
                        <path
                            d="m480-120.67-46.67-42q-104.18-95.08-172.25-164.04Q193-395.67 152.67-450.17q-40.34-54.5-56.5-99.16Q80-594 80-640q0-91.44 61.33-152.72 61.34-61.28 152-61.28 55.34 0 103.34 25.33 48 25.34 83.33 72.67 39.33-49.33 86.33-73.67 47-24.33 100.34-24.33 90.66 0 152 61.28Q880-731.44 880-640q0 46-16.17 90.67-16.16 44.66-56.5 99.16-40.33 54.5-108.41 123.46-68.07 68.96-172.25 164.04l-46.67 42Zm0-88.66q99.49-90.67 163.75-155.5Q708-429.67 745.67-478.17q37.66-48.5 52.66-86.42t15-75.31q0-64.1-41.33-105.77-41.33-41.66-105.18-41.66-50.02 0-92.59 29.83-42.56 29.83-65.56 81.5h-58q-22.34-51-64.9-81.17-42.57-30.16-92.59-30.16-63.85 0-105.18 41.66-41.33 41.67-41.33 105.88 0 37.46 15 75.62 15 38.17 52.66 87Q252-428.33 316.67-363.83q64.66 64.5 163.33 154.5Zm0-289Z" />
                    </svg>
                    <div>
                        Like
                    </div>
                </button>
            </div>
            <div id="progress-container">
                <input type="range" id="progress" value="0" step="0.1" min="0" max="100">

            </div>
            <div id="time-container">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div id="controls">
                <button id="loop-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" height="48px" width="48px" fill="#e3e3e3"><path d="M9.8,31.45q-1-1.8-1.4-3.63T8,24.1q0-6.55 4.73-11.28T24,8.1h2.15l-4-4L24.1,2.15L31.55,9.6L24.1,17.05l-2-2l3.95-3.95H24q-5.35,0-9.17,3.82T11,24.1q0,1.45 0.28,2.75t0.68,2.45L9.8,31.45ZM23.8,46l-7.45-7.45L23.8,31.1l1.95,1.95l-4,4H24q5.35,0 9.18-3.82T37,24.05q0-1.45-0.25-2.75T36,18.85l2.15-2.15q1,1.8 1.43,3.63T40,24.05q0,6.55-4.73,11.28T24,40.05H21.75l4,4L23.8,46Z"/></svg>
                </button>
                <button id="prev">
                    <svg xmlns="http://www.w3.org/2000/svg" height="53px" viewBox="0 -960 960 960" width="53px"
                        fill="#e3e3e3">
                        <path
                            d="M220-240v-480h80v480h-80Zm520 0L380-480l360-240v480Zm-80-240Zm0 90v-180l-136 90 136 90Z" />
                    </svg>
                </button>
                <button id="play">
                    <svg xmlns="http://www.w3.org/2000/svg" height="53px" viewBox="0 -960 960 960" width="53px"
                        fill="#e3e3e3">
                        <path
                            d="m383-310 267-170-267-170v340Zm97 230q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82-31.5 155T763-197.5q-54 54.5-127 86T480-80Zm0-60q142 0 241-99.5T820-480q0-142-99-241t-241-99q-141 0-240.5 99T140-480q0 141 99.5 240.5T480-140Zm0-340Z" />
                    </svg>
                </button>
                <button id="next">
                    <svg xmlns="http://www.w3.org/2000/svg" height="53px" viewBox="0 -960 960 960" width="53px"
                        fill="#e3e3e3">
                        <path
                            d="M660-240v-480h80v480h-80Zm-440 0v-480l360 240-360 240Zm80-240Zm0 90 136-90-136-90v180Z" />
                    </svg>
                </button>
                <button  id="seek-forward">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" height="48px" width="48px" fill="#e3e3e3"><path d="M28.8,40V37h6l-8.7-8.65l2.1-2.15L37,34.9V28.85h3V40H28.8ZM10.1,40L8,37.85L34.9,11H28.8V8H40V19.15H37v-6L10.1,40Zm9.65-18.15L8,10.15L10.15,8L21.9,19.7l-2.15,2.15Z"/></svg>
                </button>

            </div>

        </div>

        <audio id="audio" autoplay></audio>
    </div>
    <div class="queue">
        <button>
            <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#e3e3e3">
                <path
                    d="m251.33-204.67-46.66-46.66L433.33-480 204.67-708.67l46.66-46.66L480-526.67l228.67-228.66 46.66 46.66L526.67-480l228.66 228.67-46.66 46.66L480-433.33 251.33-204.67Z" />
            </svg>
        </button>
    </div>
    <link rel="stylesheet" href="/static/player.css">


    <script src="/static/script.js"></script>
</body>

</html>
